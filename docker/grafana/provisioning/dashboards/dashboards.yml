# Loads every dashboard JSON in /var/lib/grafana/dashboards at startup.
# The files are mounted read-only from ./docker/grafana/dashboards.

apiVersion: 1

providers:
  - name: telemetry-demo
    orgId: 1
    folder: Telemetry demo
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
